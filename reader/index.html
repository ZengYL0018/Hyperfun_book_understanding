<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understanding NMR Spectroscopy · 精读版</title>
<meta name="description" content="Understanding NMR Spectroscopy (James Keeler, 2nd ed.) 本地精读阅读器：进度、书签、笔记与索引。">
<link rel="stylesheet" href="app.css">
<script>
  /* 首屏前应用主题，避免闪白 */
  (function () {
    try {
      var ui = JSON.parse(localStorage.getItem('nmr.reader.ui.v2') || '{}');
      if (ui.theme) document.documentElement.dataset.theme = ui.theme;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
      if (localStorage.getItem('nmr.reader.state.v2')) { /* 有本地数据 */ }
    } catch (e) { }
  })();
</script>
</head>
<body>

<div id="app">
  <header>
    <div id="hdr-progress"></div>
    <button class="ibtn" id="burger" title="目录" aria-label="目录"></button>

    <div class="brand">
      <span class="glyph">NMR</span>
      <span class="tx"><strong id="b-title">Understanding NMR Spectroscopy</strong>
      <small id="b-sub">James Keeler · 2nd ed.</small></span>
    </div>

    <div class="spacer"></div>

    <div class="search">
      <span class="ico">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-3.5-3.5"/></svg>
      </span>
      <input id="q" type="search" placeholder="全文检索（/ 聚焦，↑↓ 选择，Enter 跳转）"
             autocomplete="off" spellcheck="false" aria-label="全文检索">
      <kbd>/</kbd>
      <div id="results" role="listbox"></div>
    </div>

    <div class="spacer"></div>

    <div class="ring" id="ring" title="学习进度" role="button" tabindex="0">
      <svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true">
        <circle class="track" cx="18" cy="18" r="15" fill="none" stroke-width="3"></circle>
        <circle class="bar" id="ring-bar" cx="18" cy="18" r="15" fill="none" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="94.25"
                transform="rotate(-90 18 18)"></circle>
      </svg>
      <span class="val"><b id="ring-pct">0%</b>已读</span>
    </div>

    <button class="ibtn" id="btn-bm" title="添加书签（B）" aria-label="书签"></button>
    <button class="ibtn" id="btn-note" title="笔记（N）" aria-label="笔记"></button>
    <button class="ibtn" id="btn-theme" title="切换主题（T）" aria-label="切换主题"></button>
  </header>

  <div id="body">
    <!-- 左：目录 / 索引 / 术语 / 图集 -->
    <aside id="side">
      <div class="tabs">
        <button class="tab on" data-pane="toc">目录</button>
        <button class="tab" data-pane="index">索引</button>
        <button class="tab" data-pane="gloss">术语</button>
        <button class="tab" data-pane="gal">图集</button>
      </div>

      <div class="pane on" id="pane-toc">
        <div id="toc-list" class="scroll"></div>
      </div>

      <div class="pane" id="pane-index">
        <div class="idx-tools">
          <input id="idx-q" type="search" placeholder="筛选术语 / 标题…" autocomplete="off" aria-label="筛选索引">
          <div class="idx-modes" id="idx-modes">
            <button data-mode="book" class="on">书后索引</button>
            <button data-mode="head">标题索引</button>
          </div>
          <div class="letters" id="idx-letters"></div>
        </div>
        <div id="idx-list" class="scroll"></div>
      </div>

      <div class="pane" id="pane-gloss">
        <div class="idx-tools">
          <input id="gloss-q" type="search" placeholder="检索术语 / 释义…" autocomplete="off" aria-label="检索术语">
          <div class="idx-hint"><span id="gloss-count"></span>中英对照 · 悬停正文术语也会弹出释义</div>
        </div>
        <div id="gloss-list" class="scroll"></div>
      </div>

      <div class="pane" id="pane-gal">
        <div class="idx-tools">
          <input id="gal-q" type="search" placeholder="筛选图注 / 编号（如 5.8）…" autocomplete="off" aria-label="筛选图集">
          <div class="idx-hint"><span id="gal-count"></span>全书插图 · 点击直达原文</div>
        </div>
        <div id="gal-list" class="scroll gal-grid"></div>
      </div>
    </aside>

    <!-- 中：正文 -->
    <main id="doc" class="scroll">
      <div id="chapter-bar">
        <button class="bar-btn" id="btn-back" disabled aria-label="返回上次位置"></button>
        <span class="crumb" id="crumb"></span>
        <span class="pos" id="pos">本章 0%</span>
        <button class="bar-btn" id="btn-type" aria-label="排版设置"></button>
        <button class="bar-btn" id="btn-cmp" aria-label="对照分屏"></button>
        <button class="bar-btn" id="btn-zen" aria-label="专注模式"></button>
      </div>
      <div id="doc-inner">
        <article id="article"></article>
        <div id="chap-foot"></div>
      </div>
      <div id="selbar" role="toolbar" aria-label="选中文字操作"></div>
    </main>

    <!-- 对照分屏：原书对应页 -->
    <section id="compare"></section>

    <!-- 右：进度 / 书签 / 笔记 -->
    <aside id="panel">
      <div class="tabs">
        <button class="tab on" data-pane="prog">进度</button>
        <button class="tab" data-pane="bm">书签<span class="badge" id="bm-count2">0</span></button>
        <button class="tab" data-pane="nt">笔记<span class="badge" id="nt-count2">0</span></button>
      </div>
      <div class="pane on" id="pane-prog"></div>
      <div class="pane" id="pane-bm">
        <div class="list scroll" id="bm-list"></div>
        <div class="pane-foot"><button class="btn primary" data-act="add-bm">＋ 在当前位置加书签</button></div>
      </div>
      <div class="pane" id="pane-nt"><div class="list scroll" id="nt-list"></div></div>
    </aside>
  </div>
</div>

<div id="pager"></div>
<div id="gcard" role="tooltip"></div>
<div id="typepop"></div>
<div id="palette">
  <div class="pal-box">
    <div class="pal-head">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="pal-q" type="text" placeholder="跳转到…" autocomplete="off" spellcheck="false" aria-label="命令面板">
      <span id="pal-count"></span>
    </div>
    <div id="pal-list" class="scroll"></div>
    <div class="pal-hint"><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 跳转 · <kbd>Esc</kbd> 关闭</div>
  </div>
</div>
<div id="zoom"><img id="zoomi" alt="放大查看"></div>
<div id="modal"></div>
<div id="toasts"></div>
<div id="boot"><div><div class="sp"></div>正在载入全书数据…</div></div>

<script src="data.js"></script>
<script src="glossary.js"></script>
<script src="app.js"></script>
</body>
</html>
